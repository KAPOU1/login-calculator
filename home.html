<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: url('wallhaven-42qxzy.jpg') no-repeat center center;
            background-size: 100% 100%;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            margin: 0;
        }

        button {
            margin-top: 20px;
            padding: 10px 25px;
            border: 2px solid #fff;
            background: transparent;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
        }

        button:hover {
            background: #fff;
            color: #162938;
        }
    </style>
</head>

<body>
    <h1 id="welcome"></h1>
    <button id="logout">Logout</button>

    <script>
        const user = JSON.parse(localStorage.getItem('currentUser'));

        // كان ما دخلش، نرجّعوه للـ login
        if (!user) {
            window.location.href = 'maine.html';
        } else {
            document.querySelector('#welcome').textContent = 'Welcome ' + user.name + ' 👋';
        }

        document.querySelector('#logout').addEventListener('click', () => {
            localStorage.removeItem('currentUser');
            window.location.href = 'maine.html';
        });
    </script>
</body>

</html>
